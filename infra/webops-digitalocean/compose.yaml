services:
  webops-worker:
    image: alpine:3.20
    command: ["sh", "-c", "echo 'Phase 3 worker intentionally disabled'; sleep infinity"]
    restart: "no"
    networks:
      - worker_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    profiles: ["manual-pilot"]

  webops-egress-gateway:
    image: alpine:3.20
    command: ["sh", "-c", "echo 'Phase 3 gateway placeholder intentionally disabled'; sleep infinity"]
    restart: "no"
    networks:
      worker_internal:
        ipv4_address: 172.30.0.2
      gateway_egress:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    profiles: ["manual-pilot"]

networks:
  worker_internal:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-webops-wkr
    ipam:
      config:
        - subnet: 172.30.0.0/24
  gateway_egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-webops-out
