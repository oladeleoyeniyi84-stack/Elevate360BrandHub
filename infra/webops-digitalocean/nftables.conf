table inet webops_filter {
  set blocked_v4 {
    type ipv4_addr
    flags interval
    elements = {
      0.0.0.0/8,
      10.0.0.0/8,
      100.64.0.0/10,
      127.0.0.0/8,
      169.254.0.0/16,
      172.16.0.0/12,
      192.0.0.0/24,
      192.0.2.0/24,
      192.168.0.0/16,
      198.18.0.0/15,
      198.51.100.0/24,
      203.0.113.0/24,
      224.0.0.0/4
    }
  }

  set blocked_v6 {
    type ipv6_addr
    flags interval
    elements = {
      ::/128,
      ::1/128,
      fc00::/7,
      fe80::/10,
      ff00::/8,
      2001:db8::/32
    }
  }

  chain output {
    type filter hook output priority -50; policy accept;
    oifname "lo" accept
    ip daddr @blocked_v4 drop
    ip6 daddr @blocked_v6 drop
  }

  chain forward {
    type filter hook forward priority -50; policy accept;

    # Worker network may communicate only within its internal bridge.
    iifname "br-webops-wkr" oifname != "br-webops-wkr" drop

    # Gateway traffic may not reach private/reserved/link-local/metadata destinations.
    iifname "br-webops-out" ip daddr @blocked_v4 drop
    iifname "br-webops-out" ip6 daddr @blocked_v6 drop
  }
}
