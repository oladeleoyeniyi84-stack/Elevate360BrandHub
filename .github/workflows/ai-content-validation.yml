name: AI Content Studio validation

on:
  pull_request:
    paths:
      - "server/routes/aiContent.ts"
      - "server/routes/aiContentPolicy.ts"
      - "server/routes/aiContentPolicy.test.ts"
      - "server/routes/aiContentIntegration.test.ts"
      - "server/services/deepseek.ts"
      - ".github/workflows/ai-content-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run check
      - name: AI Content API response-contract tests
        run: npx tsx --test server/routes/aiContentPolicy.test.ts
      - name: Authenticated AI Content HTTP integration tests (mock provider)
        run: timeout 90s npx tsx --test server/routes/aiContentIntegration.test.ts
      - name: Production build
        run: npm run build
