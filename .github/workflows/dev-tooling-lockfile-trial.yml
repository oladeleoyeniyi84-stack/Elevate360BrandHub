name: Isolated compatible dev-tooling security patches
on:
  push:
    branches: [security/dev-tooling-compatible-20261031]
    paths:
      - package.json
      - .github/workflows/dev-tooling-lockfile-trial.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate package-lock with registry integrity
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate patch versions
        shell: bash
        run: |
          node - <<'NODE'
          const p = require('./package-lock.json').packages;
          for (const [k,expected] of Object.entries({
            'vite':'7.3.7',
            'postcss':'8.5.31',
            '@babel/core':'7.29.11'
          })) {
            const actual = p['node_modules/'+k]?.version;
            if(actual !== expected) throw Error(k+' expected '+expected+' got '+actual);
          }
          NODE
      - name: Confirm locked installation and typecheck
        run: |
          npm ci
          npm run check
      - name: Run test suite
        env:
          DATABASE_URL: postgres://webops_test:webops_test@127.0.0.1:5432/webops_test
          OPENAI_API_KEY: ci-placeholder-not-a-real-openai-key
        run: npm test
      - name: Build production
        run: npm run build
      - name: Audit full dependency tree and production separately
        shell: bash
        run: |
          npm audit --json > full-audit.json || true
          npm audit --omit=dev --json > production-audit.json || true
          node - <<'NODE'
          const full = require('./full-audit.json');
          const prod = require('./production-audit.json');
          for (const pkg of ['vite','postcss','@babel/core']) {
            if (full.vulnerabilities?.[pkg]) throw Error(pkg+' advisory not resolved');
          }
          const n=prod.metadata?.vulnerabilities||{};
          if ((n.critical||0)+(n.high||0)+(n.moderate||0)+(n.low||0)>0) throw Error('Production vulnerability regression: '+JSON.stringify(n));
          console.log('Remaining dev tooling advisories: '+JSON.stringify(full.metadata?.vulnerabilities));
          NODE
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-tooling-security-audit
          path: |
            full-audit.json
            production-audit.json
          retention-days: 7
      - name: Commit validated lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then echo 'No lockfile change'; exit 1; fi
          git commit -m 'chore(security): lock compatible dev toolchain fixes'
          git push origin HEAD:security/dev-tooling-compatible-20261031
