name: Read-only live browser acceptance

on:
  push:
    branches: [qa/live-browser-acceptance-20261031]
    paths:
      - "scripts/live-browser-acceptance.mjs"
      - ".github/workflows/live-browser-acceptance.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # This suite visits the live site only; it imports no app packages.
      # Install Playwright outside the project to avoid re-resolving the app's
      # lockfile (which can pull unrelated unavailable optional artifacts).
      - name: Install browser test runner in an isolated directory
        shell: bash
        run: |
          mkdir -p /tmp/e360-playwright-runner
          npm install --prefix /tmp/e360-playwright-runner --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          mkdir -p node_modules
          ln -s /tmp/e360-playwright-runner/node_modules/playwright node_modules/playwright
          ln -s /tmp/e360-playwright-runner/node_modules/playwright-core node_modules/playwright-core
      - name: Execute read-only browser journey checks
        shell: bash
        run: |
          set -o pipefail
          node scripts/live-browser-acceptance.mjs 2>&1 | tee browser-acceptance.log
      - name: Preserve acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elevate360-readonly-browser-acceptance
          path: browser-acceptance.log
          if-no-files-found: ignore
          retention-days: 7
