name: WebOps validation

on:
  pull_request:
    branches:
      - main
      - webops/phase-2-diagnostics-policy
    paths:
      - "server/webops/**"
      - "server/webopsPolicy.test.ts"
      - "server/webopsDiagnostics.test.ts"
      - "docs/autonomous-webops-phase1-baseline.md"
      - "docs/autonomous-webops-phase1-completion-report.md"
      - "docs/autonomous-webops-phase2-plan.md"
      - "docs/autonomous-webops-phase2-implementation-report.md"
      - "docs/autonomous-webops-dependency-audit-plan.md"
      - "docs/autonomous-webops-phase2-hardening-report.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/webops-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile for authorized security pins
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile on remediation branch
        if: github.head_ref == 'webops/dependency-remediation-critical-high'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security(deps): synchronize lockfile for critical high pins"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: webops-security-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency audit
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true

      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webops-npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run check

      - name: Run tests
        shell: bash
        env:
          DATABASE_URL: postgres://webops_test:webops_test@127.0.0.1:5432/webops_test
          OPENAI_API_KEY: ci-placeholder-not-a-real-openai-key
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webops-test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production bundle
        run: npm run build
