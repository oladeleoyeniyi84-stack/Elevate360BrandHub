name: WebOps validation

on:
  pull_request:
    branches:
      - main
      - webops/phase-2-diagnostics-policy
      - webops/phase-2-prepilot-hardening
      - webops/phase-2-route-health-pilot
    paths:
      - "server/webops/**"
      - "server/webopsPolicy.test.ts"
      - "server/webopsDiagnostics.test.ts"
      - "server/publicCrawl.test.ts"
      - "client/src/App.tsx"
      - "shared/conciergeContext.ts"
      - "docs/autonomous-webops-phase1-baseline.md"
      - "docs/autonomous-webops-phase1-completion-report.md"
      - "docs/autonomous-webops-phase2-plan.md"
      - "docs/autonomous-webops-phase2-implementation-report.md"
      - "docs/autonomous-webops-dependency-audit-plan.md"
      - "docs/autonomous-webops-phase2-hardening-report.md"
      - "docs/autonomous-webops-phase2-prepilot-report.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/webops-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify retired guide references are absent
        shell: bash
        run: |
          if grep -F '<Route path="/guide"' client/src/App.tsx; then
            echo "Retired /guide client route is still present" >&2
            exit 1
          fi
          if grep -F '  "/guide": {' shared/conciergeContext.ts; then
            echo "Retired /guide concierge context is still present" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency audit
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webops-npm-audit
          path: |
            npm-audit.json
            npm-audit-production.json
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run check

      - name: Run tests
        shell: bash
        env:
          DATABASE_URL: postgres://webops_test:webops_test@127.0.0.1:5432/webops_test
          OPENAI_API_KEY: ci-placeholder-not-a-real-openai-key
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webops-test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production bundle
        run: npm run build

      - name: Run Founder-authorized read-only live pilot
        if: github.head_ref == 'webops/phase-2-prepilot-hardening'
        shell: bash
        run: |
          npx tsx server/webops/livePilot.ts > webops-live-pilot.json

      - name: Preserve live pilot report
        if: always() && github.head_ref == 'webops/phase-2-prepilot-hardening'
        uses: actions/upload-artifact@v4
        with:
          name: webops-live-pilot
          path: webops-live-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Run Founder-authorized read-only route health pilot
        if: github.head_ref == 'webops/phase-2-route-health-pilot' || github.head_ref == 'webops/phase-2-guide-retirement-cleanup'
        shell: bash
        run: |
          npx tsx server/webops/routeHealthPilot.ts > webops-route-health-pilot.json

      - name: Preserve route health pilot report
        if: always() && (github.head_ref == 'webops/phase-2-route-health-pilot' || github.head_ref == 'webops/phase-2-guide-retirement-cleanup')
        uses: actions/upload-artifact@v4
        with:
          name: webops-route-health-pilot
          path: webops-route-health-pilot.json
          if-no-files-found: error
          retention-days: 7
