name: WebOps validation

on:
  pull_request:
    branches:
      - main
      - webops/phase-2-diagnostics-policy
      - webops/phase-2-prepilot-hardening
      - webops/phase-2-route-health-pilot
      - webops/phase-3-implementation
      - webops/phase-3-digitalocean-provisioning
      - webops/phase-3-network-validation
    paths:
      - "server/webops/**"
      - "server/webopsPolicy.test.ts"
      - "server/webopsDiagnostics.test.ts"
      - "server/publicCrawl.test.ts"
      - "client/src/App.tsx"
      - "shared/conciergeContext.ts"
      - "infra/webops-digitalocean/**"
      - "infra/webops/validation/**"
      - "infra/webops/runtime/**"
      - "docs/autonomous-webops-phase1-baseline.md"
      - "docs/autonomous-webops-phase1-completion-report.md"
      - "docs/autonomous-webops-phase2-plan.md"
      - "docs/autonomous-webops-phase2-implementation-report.md"
      - "docs/autonomous-webops-dependency-audit-plan.md"
      - "docs/autonomous-webops-phase2-hardening-report.md"
      - "docs/autonomous-webops-phase2-prepilot-report.md"
      - "docs/autonomous-webops-phase2-integration-plan.md"
      - "docs/autonomous-webops-phase2-release-readiness.md"
      - "docs/autonomous-webops-phase3-*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/webops-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, build, and Phase 3 infra checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify retired guide references are absent
        shell: bash
        run: |
          if grep -F '<Route path="/guide"' client/src/App.tsx; then
            echo "Retired /guide client route is still present" >&2
            exit 1
          fi
          if grep -F '  "/guide": {' shared/conciergeContext.ts; then
            echo "Retired /guide concierge context is still present" >&2
            exit 1
          fi

      - name: Phase 3 infrastructure static safety checks
        if: startsWith(github.head_ref, 'webops/phase-3-')
        shell: bash
        run: |
          set -euo pipefail
          test -f infra/webops-digitalocean/main.tf
          test -f infra/webops-digitalocean/cloud-init.yaml
          test -f infra/webops-digitalocean/compose.yaml
          test -f infra/webops-digitalocean/nftables.conf
          if [ -f infra/webops/validation/validate-network.sh ]; then
            bash -n infra/webops/validation/validate-network.sh
          fi
          if [ -f infra/webops/validation/evidence-schema.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('infra/webops/validation/evidence-schema.json','utf8'))"
            grep -F '"minItems": 6' infra/webops/validation/evidence-schema.json
            grep -F '"maxItems": 6' infra/webops/validation/evidence-schema.json
          fi
          if grep -R --line-number --fixed-strings 'flush ruleset' infra/webops-digitalocean; then
            echo "Broad nftables flush ruleset is forbidden" >&2
            exit 1
          fi
          grep -F 'templatefile(' infra/webops-digitalocean/main.tf
          grep -F 'nftables_config' infra/webops-digitalocean/main.tf
          grep -F '/etc/nftables.d/webops.nft' infra/webops-digitalocean/cloud-init.yaml
          grep -F 'webops-nftables.service' infra/webops-digitalocean/cloud-init.yaml
          grep -F 'internal: true' infra/webops-digitalocean/compose.yaml
          grep -F 'iifname "br-webops-wkr" oifname != "br-webops-wkr" drop' infra/webops-digitalocean/nftables.conf

      - name: Set up Terraform
        if: startsWith(github.head_ref, 'webops/phase-3-')
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Phase 3 Terraform
        if: startsWith(github.head_ref, 'webops/phase-3-')
        working-directory: infra/webops-digitalocean
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency audit
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webops-npm-audit
          path: |
            npm-audit.json
            npm-audit-production.json
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run check

      - name: Run tests
        shell: bash
        env:
          DATABASE_URL: postgres://webops_test:webops_test@127.0.0.1:5432/webops_test
          OPENAI_API_KEY: ci-placeholder-not-a-real-openai-key
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webops-test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production bundle
        run: npm run build

      - name: Run Founder-authorized read-only live pilot
        if: github.head_ref == 'webops/phase-2-prepilot-hardening'
        shell: bash
        run: |
          npx tsx server/webops/livePilot.ts > webops-live-pilot.json

      - name: Preserve live pilot report
        if: always() && github.head_ref == 'webops/phase-2-prepilot-hardening'
        uses: actions/upload-artifact@v4
        with:
          name: webops-live-pilot
          path: webops-live-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Run Founder-authorized read-only route health pilot
        if: github.head_ref == 'webops/phase-2-route-health-pilot' || github.head_ref == 'webops/phase-2-guide-retirement-cleanup' || github.head_ref == 'webops/phase-2-integration-plan'
        shell: bash
        run: |
          npx tsx server/webops/routeHealthPilot.ts > webops-route-health-pilot.json

      - name: Preserve route health pilot report
        if: always() && (github.head_ref == 'webops/phase-2-route-health-pilot' || github.head_ref == 'webops/phase-2-guide-retirement-cleanup' || github.head_ref == 'webops/phase-2-integration-plan')
        uses: actions/upload-artifact@v4
        with:
          name: webops-route-health-pilot
          path: webops-route-health-pilot.json
          if-no-files-found: error
          retention-days: 7

  manual-runtime:
    name: Manual runtime build and hermetic tests
    if: startsWith(github.head_ref, 'webops/phase-3-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build generated runtime modules
        run: node infra/webops/runtime/build.mjs

      - name: Run manual runtime tests
        run: node --test infra/webops/runtime/*.test.mjs

      - name: Validate manual Compose definition
        run: docker compose -f infra/webops/runtime/compose.pilot.yaml --profile manual-pilot config --quiet

      - name: Build manual runtime image
        run: docker build --file infra/webops/runtime/Dockerfile --tag elevate360-webops-pilot:ci .
