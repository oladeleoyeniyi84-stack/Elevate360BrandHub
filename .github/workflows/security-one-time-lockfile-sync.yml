name: One-time isolated security lockfile synchronization

on:
  push:
    branches:
      - security/2026-10-31-compatible-patches
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Re-resolve lockfile against npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm precise patched versions
        shell: bash
        run: |
          node - <<'NODE'
          const p = require('./package-lock.json').packages;
          for (const [key, expected] of Object.entries({
            'node_modules/dompurify': '3.4.17',
            'node_modules/body-parser': '2.4.0',
            'node_modules/qs': '6.16.1'
          })) {
            if (p[key]?.version !== expected) throw Error(key + ': expected ' + expected + ', got ' + p[key]?.version);
          }
          NODE
      - name: Confirm locked install, typecheck, tests and build
        env:
          DATABASE_URL: postgres://webops_test:webops_test@127.0.0.1:5432/webops_test
          OPENAI_API_KEY: ci-placeholder-not-a-real-openai-key
        shell: bash
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Confirm target advisory remediation
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'NODE'
          const audit = require('./npm-audit-production.json');
          for (const name of ['dompurify', 'body-parser', 'qs']) {
            if (audit.vulnerabilities?.[name]) throw Error(name + ' remains vulnerable');
          }
          console.log('Targeted advisories cleared; residual vulnerabilities: ', audit.metadata?.vulnerabilities);
          NODE
      - name: Commit only the regenerated npm lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change generated"
            exit 1
          fi
          git commit -m "chore(security): regenerate lockfile for compatible patches"
          git push origin HEAD:security/2026-10-31-compatible-patches
