name: Isolated Zod 4 compatibility trial

on:
  push:
    branches: [security/zod-v4-compatibility-20261031]
    paths:
      - "package.json"
      - "shared/schema.ts"
      - "server/**"
      - ".github/workflows/zod-v4-migration-ci.yml"

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve actual dependency tree and locked integrity
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency inventory
        shell: bash
        run: |
          npm ls zod zod-validation-error drizzle-zod --all || true
          npm audit --omit=dev --json > zod-audit.json || true
          node - <<'NODE'
          const audit = require('./zod-audit.json');
          if(audit.vulnerabilities?.zod || audit.vulnerabilities?.['zod-validation-error']) throw new Error('Zod advisory remains');
          const lock = require('./package-lock.json');
          const version = lock.packages['node_modules/zod']?.version;
          if(!version || Number(version.split('.')[0]) < 4) throw new Error('Zod 4 not installed');
          console.log('Zod security advisories absent from npm production audit');
          NODE
      - name: TypeScript compatibility
        run: npm run check
      - name: Run comprehensive tests
        env:
          DATABASE_URL: postgres://webops_test:webops_test@127.0.0.1:5432/webops_test
          OPENAI_API_KEY: ci-placeholder-not-a-real-openai-key
        run: npm test
      - name: Build both bundles
        run: npm run build
      - name: Commit validated lockfile only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changed lockfile"; exit 1
          fi
          git commit -m "chore(security): lock validated Zod 4 dependency tree"
          git push origin HEAD:security/zod-v4-compatibility-20261031
